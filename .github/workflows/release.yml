name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Get short SHA
        id: get-sha
        run: echo "tag_name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compile resume (PDF + PNG)
        env:
          TAG: ${{ steps.get-sha.outputs.tag_name }}
          TITLE: ${{ vars.TITLE }}
          AUTHOR: ${{ vars.AUTHOR }}
          EMAIL: ${{ vars.EMAIL }}
          LINKS: ${{ vars.LINKS }}
        run: |
          nix develop --command typst compile resume.typ \
            --input "title=$TITLE" \
            --input "author=$AUTHOR" \
            --input "email=$EMAIL" \
            --input "links=$LINKS" \
            --format pdf "resume-$TAG.pdf"

          nix develop --command typst compile resume.typ \
            --input "title=$TITLE" \
            --input "author=$AUTHOR" \
            --input "email=$EMAIL" \
            --input "links=$LINKS" \
            --format png --pages 1 resume.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.get-sha.outputs.tag_name }}
          name: Release ${{ steps.get-sha.outputs.tag_name }}
          generate_release_notes: true
          files: |
            resume-${{ steps.get-sha.outputs.tag_name }}.pdf
            resume.png
