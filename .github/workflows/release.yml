name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Get short SHA
        id: get-sha
        run: echo "tag_name=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compile resume (PDF + PNG)
        env:
          TAG: ${{ steps.get-sha.outputs.tag_name }}
          TITLE: ${{ vars.TITLE }}
          AUTHOR: ${{ vars.AUTHOR }}
          EMAIL: ${{ vars.EMAIL }}
          LINKS: ${{ vars.LINKS }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.server_url }}/${{ github.repository }}
        run: |
          compile() {
            nix develop --command typst compile resume.typ \
              --input "title=$TITLE" \
              --input "author=$AUTHOR" \
              --input "email=$EMAIL" \
              --input "links=$LINKS" \
              --input "commit=$COMMIT" \
              --input "repo=$REPO" \
              "$@"
          }
          compile --format pdf "resume-$TAG.pdf"
          compile --format png --pages 1 resume.png

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.get-sha.outputs.tag_name }}
          name: Release ${{ steps.get-sha.outputs.tag_name }}
          generate_release_notes: true
          files: |
            resume-${{ steps.get-sha.outputs.tag_name }}.pdf
            resume.png
